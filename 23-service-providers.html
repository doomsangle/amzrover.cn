        .nav-tabs { display: flex; background: white; border-bottom: 2px solid #eee; position: sticky; top: 0; z-index: 100; }

        .nav-tab.active { color: #FF6B00; border-bottom-color: #FF6B00; background: #FFF8E1; }
        .category-bar { display: flex; gap: 10px; padding: 15px 20px; background: white; flex-wrap: wrap; border-bottom: 1px solid #eee; }
        .category-tag { padding: 6px 14px; background: #f5f5f5; border-radius: 20px; font-size: 13px; cursor: pointer; color: #666; transition: all 0.2s; }
        .category-tag:hover { background: #FFF3E0; color: #FF9900; }
        .category-tag.active { background: linear-gradient(135deg, #FF9900 0%, #FF6B00 100%); color: white; }
        .section-title { padding: 15px 20px; font-size: 14px; font-weight: 600; color: #333; background: white; }
        .providers-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 15px 20px; background: #f5f7fa; }
        .provider-card { background: white; border-radius: 8px; overflow: hidden; transition: all 0.3s; cursor: pointer; border: 1px solid #eee; }
        .provider-card:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-color: #FF9900; }
        .card-header { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; }
        .card-header .price-badge { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #FF6B00; }
        .card-body { padding: 12px; }
        .provider-name { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .provider-desc { font-size: 11px; color: #999; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .provider-tags { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
        .provider-tag { padding: 2px 6px; background: #f0f0f0; border-radius: 3px; font-size: 10px; color: #888; }
        .provider-tag.hot { background: #FFF3E0; color: #FF9900; }
        .contact-btn { margin-top: 10px; display: block; width: 100%; padding: 7px; text-align: center; background: linear-gradient(135deg, #FF9900 0%, #FF6B00 100%); color: white; font-size: 12px; font-weight: 600; border-radius: 4px; text-decoration: none; }
        .contact-btn:hover { opacity: 0.9; }
        @media (max-width: 1200px) { .providers-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 900px) { .providers-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .providers-grid { grid-template-columns: repeat(2, 1fr); } }
        .container { max-width: 1200px; margin: 0 auto; }
        .category-tabs { display: flex; gap: 8px; padding: 12px 20px; background: white; overflow-x: auto; }
        .category-tab-item { flex-shrink: 0; padding: 5px 12px; background: #f8f9fa; border-radius: 15px; font-size: 12px; cursor: pointer; color: #666; }
        .category-tab-item.active { background: #FF9900; color: white; }

    function getCatName(c) {
        var names = {"all":"全部服务商","ip":"知识产权","tax":"税务合规","tools":"工具软件","appeal":"申诉和解","promotion":"站内外推广","review":"测评服务","payment":"收款支付","logistics":"国际快递","warehouse":"海外仓服务","source":"货源网站","cert":"检测认证","insurance":"跨境保险","store":"全球开店"};
        return names[c] || c;
    }

    function render(cat) {
        var grid = document.getElementById('grid');
        var title = document.getElementById('sectionTitle');
        var list = cat === 'all' ? providers : providers.filter(function(p){ return p.category === cat; });
        
        title.textContent = getCatName(cat);
        
        grid.innerHTML = list.map(function(p){
            var link = p.detail || p.url || '#';
            var target = p.detail ? '_self' : '_blank';
            return '<div class="provider-card" onclick="window.open(\''+link+'\',\''+target+'\')"><div class="card-header" style="background:linear-gradient(135deg,'+p.color+' 0%,rgba('+hexToRgb(p.color)+',0.6) 100%)">'+p.icon+'<div class="price-badge">'+p.price+'</div></div><div class="card-body"><div class="provider-name">'+p.name+'</div><div class="provider-desc">'+p.desc+'</div><div class="provider-tags">'+p.tags.map(function(t){ return '<span class="provider-tag">'+t+'</span>'; }).join('')+'</div><a href="'+link+'" target="'+target+'" class="contact-btn">立即咨询</a></div></div>';
        }).join('');
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? parseInt(result[1], 16)+','+parseInt(result[2], 16)+','+parseInt(result[3], 16) : '255,107,0';
    }

    function switchTab(tab) {
        document.querySelectorAll('.nav-tab').forEach(function(t){ t.classList.remove('active'); });
        event.target.classList.add('active');
        if(tab === 'service') render('all');
        else if(tab === 'logistics') render('logistics');
        else if(tab === 'warehouse') render('warehouse');
        else if(tab === 'store') render('store');
    }

    document.querySelectorAll('.category-tag').forEach(function(tag) {
        tag.addEventListener('click', function() {
            document.querySelectorAll('.category-tag').forEach(function(t){ t.classList.remove('active'); });
            this.classList.add('active');
            render(this.dataset.cat);
        });
    });

    render('all');
